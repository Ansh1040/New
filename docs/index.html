const themeButton=document.getElementById('theme');
function theme(value){document.documentElement.dataset.theme=value;themeButton.textContent=value==='dark'?'Light mode':'Dark mode';themeButton.setAttribute('aria-label','Switch to '+(value==='dark'?'light':'dark')+' mode');}
try{theme(localStorage.getItem('shared-progress-theme')||'dark')}catch{theme('dark')}
themeButton.onclick=()=>{const value=document.documentElement.dataset.theme==='dark'?'light':'dark';theme(value);try{localStorage.setItem('shared-progress-theme',value)}catch{}};
function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function stat(label,value,detail){const c=el('section',undefined,'card');c.append(el('div',label,'muted'),el('div',value,'stat'),el('small',detail));return c}
function card(name,percent,label,detail){const c=el('section',undefined,'card');const row=el('div',undefined,'row');row.append(el('h3',name),el('span',label,'percent'));c.append(row);const bar=el('div',undefined,'track');bar.setAttribute('role','progressbar');bar.setAttribute('aria-label',name+' progress');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');if(percent!==null)bar.setAttribute('aria-valuenow',String(percent));else bar.setAttribute('aria-valuetext','Not recorded');const fill=el('div',undefined,'fill');fill.style.width=(percent||0)+'%';bar.append(fill);c.append(bar,el('small',detail,'status-pill '+(detail==='In progress'||detail==='Completed'?'active':'pending')));return c}
const countdownGrid=el('div',undefined,'grid countdown-grid');countdownGrid.style.marginBottom='18px';document.getElementById('summary').before(countdownGrid);
const deadlines=[{title:'Course completion',date:'1 January 2027',target:'2027-01-01T00:00:00+05:30',detail:'Course completion with daily revision and DPP practice.'},{title:'Final paper',date:'1 February 2027',target:'2027-02-01T00:00:00+05:30',detail:'Your target paper date.'}];
const countdownViews=deadlines.map(d=>{const c=el('section',undefined,'card countdown-card');const timer=el('div',undefined,'countdown-units');timer.setAttribute('role','timer');timer.setAttribute('aria-label',d.title+' countdown');const values=['Days','Hours','Minutes','Seconds'].map(unit=>{const cell=el('div',undefined,'countdown-unit');const number=el('strong','—');cell.append(number,el('span',unit));timer.append(cell);return number});c.append(el('h3',d.title),el('p',d.date+' · IST','percent'),timer,el('p',d.detail,'muted'));countdownGrid.append(c);return {d,timer,values}});
function updateCountdowns(){countdownViews.forEach(({d,timer,values})=>{const t=Math.max(0,Math.ceil((Date.parse(d.target)-Date.now())/1000));const parts=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];values.forEach((v,i)=>v.textContent=String(parts[i]).padStart(2,'0'));if(!t)timer.setAttribute('aria-label',d.title+' target date reached')})}
updateCountdowns();setInterval(updateCountdowns,1000);
let lastSnapshot='';
function refreshSnapshot(){return fetch('./progress.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
const signature=JSON.stringify(data);if(signature===lastSnapshot)return;lastSnapshot=signature;
['summary','subjects','tests','dpp-summary','dpp-subjects'].forEach(id=>document.getElementById(id).replaceChildren());
const recorded=data.subjects.filter(s=>s.progress!==null);const avg=recorded.length?Math.round(recorded.reduce((a,s)=>a+s.progress,0)/recorded.length):0;
const format=v=>new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'})+' IST';
document.getElementById('updated').textContent='Snapshot updated '+format(data.updatedAt);
document.getElementById('summary').append(stat('Average subject progress',avg+'%',recorded.length+' subjects with recorded percentages'),stat('Tests completed',data.tests.completed+' / '+data.tests.available,data.tests.percent+'% completed · '+data.tests.upcoming+' upcoming'),stat('Subjects tracked',String(data.subjects.length),'CS GATE preparation'));
data.subjects.forEach(s=>document.getElementById('subjects').append(card(s.name,s.progress,s.progress===null?'—':s.progress+'%',s.progress===null?'Not recorded':s.progress===100?'Completed':s.progress===0?'Not started':'In progress')));
data.tests.groups.forEach(g=>document.getElementById('tests').append(card(g.subject,g.available?Math.round(g.completed/g.available*100):0,g.completed+' / '+g.available,'Tests completed'+(g.upcoming?' · '+g.upcoming+' upcoming':''))));
if(data.dpp){
 const d=data.dpp;
 document.getElementById('dpp-captured').textContent='DPP capture: '+format(d.capturedAt)+'. New DPPs are added as units finish. PDF/video counts are available resources; completion is not supplied by PW.';
 document.getElementById('dpp-summary').append(stat('DPP quizzes completed',d.completed+' / '+d.available,d.percent+'% of released quizzes'),stat('DPP PDFs',String(d.pdfs),'Worksheets and discussion notes'),stat('Solution videos',String(d.videos),'Available DPP discussions'));
 d.groups.forEach(g=>{const c=card(g.subject,g.available?Math.round(g.completed/g.available*100):0,g.completed+' / '+g.available,'DPP quizzes completed');const assets=el('div',undefined,'dpp-assets');assets.append(el('span',g.pdfs+' PDFs'),el('span',g.videos+' videos'));c.append(assets);document.getElementById('dpp-subjects').append(c)});
}else{document.getElementById('dpp-captured').textContent='No DPP snapshot published yet.';}
updateSectionTotals(data);
document.getElementById('note').textContent='Read-only progress. PW captured '+(data.pwCapturedAt?format(data.pwCapturedAt):'not yet')+'. Publish updates manually with Sync, refresh & publish in the tracker. This page checks for published updates every minute. Test counts cover imported cards.';
}).catch(()=>{if(!lastSnapshot)document.getElementById('updated').textContent='The snapshot could not be loaded. Please refresh this page.'});}
refreshSnapshot();setInterval(refreshSnapshot,60000);window.addEventListener('focus',refreshSnapshot);
</script>

<script>
function distinguishSection(gridId,className,mark,kicker,description){
 const grid=document.getElementById(gridId),heading=gridId==='dpp-subjects'?document.getElementById('dpp-heading'):grid.previousElementSibling;
 let section;
 if(gridId==='dpp-subjects')section=heading.parentElement;
 else{section=document.createElement('section');heading.before(section);section.append(heading,grid);heading.id=gridId+'-heading';section.setAttribute('aria-labelledby',heading.id)}
 section.className='dashboard-section '+className;
 const block=document.createElement('div');block.className='section-heading';
 const icon=document.createElement('span');icon.className='section-mark';icon.setAttribute('aria-hidden','true');icon.textContent=mark;
 const copy=document.createElement('div');copy.className='section-copy';const label=document.createElement('p');label.className='section-kicker';label.textContent=kicker;
 const detail=document.createElement('p');detail.className='section-description';detail.textContent=description;
 heading.before(block);copy.append(label,heading,detail);block.append(icon,copy);
 const collapse=document.createElement('details');collapse.className=section.className;collapse.setAttribute('aria-labelledby',heading.id);
 const toggle=document.createElement('summary');toggle.className='section-toggle';
 const top=document.createElement('div');top.className='section-toggle-top';const chevron=document.createElement('span');chevron.className='section-chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';top.append(block,chevron);
 const progress=document.createElement('div');progress.className='section-total';progress.id=gridId+'-total';progress.append(el('p','Loading progress…','section-total-label'));
 toggle.append(top,progress);const contents=document.createElement('div');contents.className='section-contents';
 for(const child of [...section.children])contents.append(child);
 collapse.append(toggle,contents);section.replaceWith(collapse);
}
function updateSectionTotals(data){
 const recorded=data.subjects.filter(s=>s.progress!==null);
 const average=recorded.length?Math.round(recorded.reduce((sum,s)=>sum+s.progress,0)/recorded.length):null;
 const entries=[['subjects',average,average===null?'Subject progress not recorded':average+'% average subject progress',recorded.length+' subjects with recorded percentages'],['tests',data.tests.percent,data.tests.completed+' / '+data.tests.available+' tests completed',data.tests.upcoming+' upcoming tests excluded'],['dpp-subjects',data.dpp?.percent??null,data.dpp?data.dpp.completed+' / '+data.dpp.available+' DPP quizzes completed':'DPP progress not published',data.dpp?data.dpp.pdfs+' PDFs · '+data.dpp.videos+' videos available':'Publish a DPP snapshot to see progress']];
 for(const [id,value,label,detail] of entries){
  const target=document.getElementById(id+'-total');if(!target)continue;target.replaceChildren();
  const row=el('div',undefined,'section-total-row');row.append(el('span',label,'section-total-label'),el('strong',value===null?'—':value+'%','section-total-percent'));
  const bar=el('div',undefined,'track');bar.setAttribute('role','progressbar');bar.setAttribute('aria-label',id==='subjects'?'Overall subject progress':id==='tests'?'Overall test completion':'Overall DPP quiz completion');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');if(value!==null)bar.setAttribute('aria-valuenow',String(value));else bar.setAttribute('aria-valuetext','Not recorded');const fill=el('div',undefined,'fill');fill.style.width=(value??0)+'%';bar.append(fill);
  target.append(row,bar,el('p',detail,'section-total-detail'));
 }
}
distinguishSection('subjects','subjects-section','▤','01 · Learning journey','Build your foundation, one subject at a time.');
const dashboardSection=document.createElement('details');dashboardSection.className='added-dashboard';dashboardSection.setAttribute('aria-labelledby','added-dashboard-title');
const dashboardHeading=el('h2','Study dashboard');dashboardHeading.id='added-dashboard-title';
const dashboardNote=el('p','Explore subjects, chapters, tests and every DPP resource in one place.','added-dashboard-note');
const dashboardFrame=document.createElement('iframe');dashboardFrame.id='study-dashboard-frame';dashboardFrame.title='Complete study progress dashboard';dashboardFrame.src='./dashboard.html';dashboardFrame.style.height='760px';dashboardFrame.setAttribute('scrolling','no');
const dashboardToggle=document.createElement('summary');dashboardToggle.className='added-dashboard-toggle';
const dashboardLabel=document.createElement('div');dashboardLabel.append(dashboardHeading,el('p','All subjects, chapters, tests and DPP resources','added-dashboard-toggle-note'));
dashboardToggle.append(dashboardLabel,el('span','⌄','added-dashboard-chevron'));
const dashboardContents=document.createElement('div');dashboardContents.className='added-dashboard-content';dashboardContents.append(dashboardNote,dashboardFrame);dashboardSection.append(dashboardToggle,dashboardContents);document.querySelector('details.subjects-section').before(dashboardSection);
function sendDashboardTheme(){dashboardFrame.contentWindow?.postMessage({source:'study-dashboard-theme',theme:document.documentElement.dataset.theme||'dark'},location.origin)}
dashboardFrame.addEventListener('load',sendDashboardTheme);dashboardSection.addEventListener('toggle',()=>{if(dashboardSection.open){sendDashboardTheme();dashboardFrame.contentWindow?.postMessage({source:'study-dashboard-resize'},location.origin)}});new MutationObserver(sendDashboardTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==dashboardFrame.contentWindow||event.data?.source!=='study-dashboard-height')return;const height=Number(event.data.height);if(Number.isFinite(height)&&height>0)dashboardFrame.style.height=Math.min(3000,Math.max(450,height+4))+'px'});
distinguishSection('tests','tests-section','✓','02 · Test arena','Track your attempts and see what is next.');
distinguishSection('dpp-subjects','dpp-section','✦','03 · Daily practice','Your DPP quizzes, worksheets and solution videos.');
</script>
