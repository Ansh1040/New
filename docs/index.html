<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ansh’s CS GATE progress</title><meta name="description" content="Ansh’s shared CS GATE subject progress and test completion snapshot."><style>
:root{color-scheme:dark;--bg:#101916;--surface:#1b2923;--ink:#e5efe9;--muted:#a9bdb1;--line:#344b3e;--accent:#75d3ac;--track:#34483c}html[data-theme=light]{color-scheme:light;--bg:#f1f6f2;--surface:#fff;--ink:#183c2c;--muted:#577565;--line:#d5e4d9;--accent:#247957;--track:#deebe2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:36px 20px 60px}header{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:8px 0}h2{margin-top:32px}h3{margin:0;font-size:16px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}.muted{color:var(--muted)}button{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);padding:20px;border-radius:16px}.stat{font-size:32px;font-weight:800}.row{display:flex;justify-content:space-between;gap:14px;align-items:start}.percent{color:var(--accent);font-weight:750;white-space:nowrap}.track{height:10px;background:var(--track);border-radius:10px;overflow:hidden;margin:14px 0 6px}.fill{height:100%;background:var(--accent);border-radius:10px}small{color:var(--muted)}footer{margin-top:32px;color:var(--muted);font-size:13px}
</style></head><body><main><header><div><div class="eyebrow">GATE COMPANION · SHARED PROGRESS</div><h1>Ansh’s CS GATE progress</h1><p class="muted" id="updated">Loading shared snapshot…</p></div><button id="theme" type="button">Light mode</button></header><div class="grid" id="summary"></div><h2>Subject progress</h2><div class="grid" id="subjects"></div><h2>Test completion by subject</h2><div class="grid" id="tests"></div><footer id="note">Read-only snapshot. Changes in the private tracker appear here after a new snapshot is published.</footer></main><script>
const designStyle=document.createElement('style');
designStyle.textContent=`
:root{--bg:#071a12;--surface:rgba(20,47,34,.82);--ink:#f0f6ef;--muted:#aac8b8;--line:#315c45;--accent:#98f0bd;--track:#314b3e;--glow:rgba(67,175,111,.16);--gold:#ecd087}
html[data-theme=light]{--bg:#559775;--surface:rgba(220,242,218,.91);--ink:#143c29;--muted:#5c7766;--line:#c4dcca;--accent:#268551;--track:#e1eadf;--glow:rgba(97,185,126,.19);--gold:#8b651b}
html[data-theme=light] header h1,html[data-theme=light] h2{color:#f2fff0;text-shadow:0 2px 10px rgba(4,35,17,.6)}html[data-theme=light] header .muted,html[data-theme=light] header .eyebrow,html[data-theme=light] footer{color:#e2f9e0;text-shadow:0 1px 6px rgba(4,35,17,.7)}body{transition:background-color .4s,color .4s;background-image:radial-gradient(ellipse at 15% 0%,var(--glow),transparent 55%),radial-gradient(ellipse at 90% 65%,var(--glow),transparent 60%)}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:linear-gradient(rgba(4,22,14,.65),rgba(4,22,14,.86)),url('./assets/green-knight.jpg') center 62%/cover no-repeat}main{position:relative;z-index:1}.ambient:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) .7px,transparent .7px);background-size:28px 28px;opacity:.15}.ambient:after{content:"";position:absolute;inset:0;background:radial-gradient(450px circle at var(--pointer-x,50%) var(--pointer-y,30%),var(--glow),transparent 75%);transition:opacity .4s}html[data-theme=light] .ambient{background-image:linear-gradient(rgba(103,182,132,.22),rgba(35,92,58,.38)),url('./assets/green-knight.jpg')}@media(max-width:520px){.ambient{background-position:center center}}
main{max-width:1240px;padding-top:30px}header{position:relative;display:block;text-align:center;padding:56px 0 30px}header .eyebrow{position:absolute;top:0;left:0;letter-spacing:.15em}#theme{position:absolute;top:-5px;right:0;border-radius:999px;padding:10px 20px}
h1{font-size:clamp(30px,4.5vw,50px);letter-spacing:-.035em;margin:12px 0}h1 span{color:var(--accent)}.tagline{font-size:20px;margin:8px 0 18px}.shared-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;color:var(--gold);background:var(--surface);padding:5px 14px;font-size:12px}#updated{font-size:12px;margin:18px 0 0}
.grid{gap:16px}.card{position:relative;backdrop-filter:blur(12px);border-radius:15px;box-shadow:0 8px 30px rgba(0,0,0,.06);transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 34px var(--glow)}
.countdown-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.countdown-card{padding:26px 28px}.countdown-card h3{font-size:23px;letter-spacing:-.025em}.countdown-card .percent{margin:5px 0 20px;font-size:14px}.countdown-units{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0}.countdown-unit{text-align:center;border-right:1px solid var(--line)}.countdown-unit:last-child{border:0}.countdown-unit strong{display:block;font-size:38px;line-height:1.2;font-variant-numeric:tabular-nums}.countdown-unit span{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.countdown-card .muted{font-size:12px;margin-bottom:0}
#summary{border:1px solid var(--line);border-radius:15px;background:var(--surface);gap:0;margin-bottom:34px}#summary .card{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none;margin:18px 0;padding:0 26px}#summary .card:last-child{border:0}.stat{letter-spacing:-.035em}h2{font-size:23px;letter-spacing:-.03em;margin:30px 0 15px}#subjects,#tests{grid-template-columns:repeat(3,minmax(0,1fr))}.row h3{font-size:14px;line-height:1.45}.track{height:9px;margin-top:18px}.fill{background:linear-gradient(90deg,var(--accent),#69ca90)}.status-pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);margin-top:5px}.status-pill.active{color:var(--accent)}.status-pill.pending{color:var(--gold)}footer{border-top:1px solid var(--line);padding-top:20px;line-height:1.8}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:760px){#subjects,#tests{grid-template-columns:repeat(2,minmax(0,1fr))}.countdown-card{padding:20px}.countdown-unit strong{font-size:26px}#summary .card{padding:0 15px}header .eyebrow{font-size:10px}}
@media(max-width:520px){.countdown-grid,#subjects,#tests{grid-template-columns:1fr}#summary{grid-template-columns:1fr}#summary .card{border:0;margin:12px 0}header{padding-top:70px}.tagline{font-size:16px}.countdown-unit strong{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}.ambient:after{display:none}}
`;
document.head.append(designStyle);
const ambient=document.createElement('div');ambient.className='ambient';ambient.setAttribute('aria-hidden','true');document.body.prepend(ambient);
const knightArt=document.createElement('div');knightArt.className='knight-art';ambient.prepend(knightArt);
const rotationStyle=document.createElement('style');rotationStyle.textContent='.ambient,html[data-theme=light] .ambient{background-image:none}.knight-art{position:absolute;left:50%;top:50%;width:100vh;height:100vw;background:linear-gradient(rgba(4,22,14,.65),rgba(4,22,14,.86)),url("./assets/green-knight.jpg") center/cover no-repeat;transform:translate(-50%,-50%) rotate(-90deg)}html[data-theme=light] .knight-art{background-image:linear-gradient(rgba(103,182,132,.22),rgba(35,92,58,.38)),url("./assets/green-knight.jpg")}';document.head.append(rotationStyle);
document.querySelector('h1').innerHTML='Ansh’s <span>CS GATE</span> progress';
const tagline=el('p','A little progress, every day.','muted tagline');document.querySelector('h1').after(tagline);
const badge=el('span','Shared study dashboard','shared-badge');tagline.after(badge);
let pointerFrame;
if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){window.addEventListener('pointermove',e=>{cancelAnimationFrame(pointerFrame);pointerFrame=requestAnimationFrame(()=>{ambient.style.setProperty('--pointer-x',e.clientX+'px');ambient.style.setProperty('--pointer-y',e.clientY+'px')})},{passive:true});}
const themeButton=document.getElementById('theme');
function theme(value){document.documentElement.dataset.theme=value;themeButton.textContent=value==='dark'?'Light mode':'Dark mode';themeButton.setAttribute('aria-label','Switch to '+(value==='dark'?'light':'dark')+' mode');}
try{theme(localStorage.getItem('shared-progress-theme')||'dark')}catch{theme('dark')}
themeButton.onclick=()=>{const value=document.documentElement.dataset.theme==='dark'?'light':'dark';theme(value);try{localStorage.setItem('shared-progress-theme',value)}catch{}};
function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function stat(label,value,detail){const c=el('section',undefined,'card');c.append(el('div',label,'muted'),el('div',value,'stat'),el('small',detail));return c}
function card(name,percent,label,detail){const c=el('section',undefined,'card');const row=el('div',undefined,'row');row.append(el('h3',name),el('span',label,'percent'));c.append(row);const bar=el('div',undefined,'track');bar.setAttribute('role','progressbar');bar.setAttribute('aria-label',name+' progress');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');if(percent!==null)bar.setAttribute('aria-valuenow',String(percent));else bar.setAttribute('aria-valuetext','Not recorded');const fill=el('div',undefined,'fill');fill.style.width=(percent||0)+'%';bar.append(fill);c.append(bar,el('small',detail,'status-pill '+(detail==='In progress'||detail==='Completed'?'active':'pending')));return c}
const countdownGrid=el('div',undefined,'grid countdown-grid');countdownGrid.style.marginBottom='18px';document.getElementById('summary').before(countdownGrid);
const deadlines=[{title:'Course completion',date:'1 January 2027',target:'2027-01-01T00:00:00+05:30',detail:'Course completion with daily revision and DPP practice.'},{title:'Final paper',date:'1 February 2027',target:'2027-02-01T00:00:00+05:30',detail:'Your target paper date.'}];
const countdownViews=deadlines.map(d=>{const c=el('section',undefined,'card countdown-card');const timer=el('div',undefined,'countdown-units');timer.setAttribute('role','timer');timer.setAttribute('aria-label',d.title+' countdown');const values=['Days','Hours','Minutes','Seconds'].map(unit=>{const cell=el('div',undefined,'countdown-unit');const number=el('strong','—');cell.append(number,el('span',unit));timer.append(cell);return number});c.append(el('h3',d.title),el('p',d.date+' · IST','percent'),timer,el('p',d.detail,'muted'));countdownGrid.append(c);return {d,timer,values}});
function updateCountdowns(){countdownViews.forEach(({d,timer,values})=>{const t=Math.max(0,Math.ceil((Date.parse(d.target)-Date.now())/1000));const parts=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];values.forEach((v,i)=>v.textContent=String(parts[i]).padStart(2,'0'));if(!t)timer.setAttribute('aria-label',d.title+' target date reached')})}
updateCountdowns();setInterval(updateCountdowns,1000);
let lastSnapshot='';
function refreshSnapshot(){return fetch('./progress.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
const signature=JSON.stringify(data);if(signature===lastSnapshot)return;lastSnapshot=signature;
['summary','subjects','tests'].forEach(id=>document.getElementById(id).replaceChildren());
const recorded=data.subjects.filter(s=>s.progress!==null);const avg=recorded.length?Math.round(recorded.reduce((a,s)=>a+s.progress,0)/recorded.length):0;
const format=v=>new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'})+' IST';
document.getElementById('updated').textContent='Snapshot updated '+format(data.updatedAt);
document.getElementById('summary').append(stat('Average subject progress',avg+'%',recorded.length+' subjects with recorded percentages'),stat('Tests completed',data.tests.completed+' / '+data.tests.available,data.tests.percent+'% completed · '+data.tests.upcoming+' upcoming'),stat('Subjects tracked',String(data.subjects.length),'CS GATE preparation'));
data.subjects.forEach(s=>document.getElementById('subjects').append(card(s.name,s.progress,s.progress===null?'—':s.progress+'%',s.progress===null?'Not recorded':s.progress===100?'Completed':s.progress===0?'Not started':'In progress')));
data.tests.groups.forEach(g=>document.getElementById('tests').append(card(g.subject,g.available?Math.round(g.completed/g.available*100):0,g.completed+' / '+g.available,'Tests completed'+(g.upcoming?' · '+g.upcoming+' upcoming':''))));
document.getElementById('note').textContent='Read-only progress. PW captured '+(data.pwCapturedAt?format(data.pwCapturedAt):'not yet')+'. Publish updates manually with Sync, refresh & publish in the tracker. This page checks for published updates every minute. Test counts cover imported cards.';
}).catch(()=>{if(!lastSnapshot)document.getElementById('updated').textContent='The snapshot could not be loaded. Please refresh this page.'});}
refreshSnapshot();setInterval(refreshSnapshot,60000);window.addEventListener('focus',refreshSnapshot);
</script></body></html>
